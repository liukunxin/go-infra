name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go-infra（gofmt / build / vet / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          dirty="$(gofmt -l .)"
          if [ -n "$dirty" ]; then
            echo "以下文件未 gofmt，请运行 gofmt -w ."
            echo "$dirty"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
